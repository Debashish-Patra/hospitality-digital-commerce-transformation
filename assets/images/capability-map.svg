<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Reservation platform capability map</title><desc id="d">Eight capability domains and the question each one must resolve: search and discovery, reservation and order, product catalog, pricing and inventory, payments and adjustments, loyalty, property fulfillment, data and reporting.</desc>
<rect width="1200" height="560" fill="#F4F7FB"/>
<text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F3A5F" text-anchor="start">Capability map for a commerce platform</text>
<text x="48" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="start">Eight domains, each with the question it has to answer</text>
<rect x="48" y="118" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<rect x="48" y="118" width="268" height="10" rx="6" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
