<text x="102" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Payments &amp; adjustments</text>
<text x="68" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Are payment responsibilities and</text>
