<rect x="336" y="118" width="268" height="10" rx="6" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<circle cx="366" cy="164" r="14" fill="#2A9D8F" stroke="none"/>
<text x="366" y="169" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="390" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Reservation &amp; order</text>
<text x="356" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can a customer complete a</text>
<text x="356" y="232.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">coherent transaction?</text>
