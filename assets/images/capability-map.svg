<text x="654" y="169" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="678" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Product catalog</text>
<text x="644" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Is the product consistently</text>
