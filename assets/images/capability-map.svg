<text x="366" y="343" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="390" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Loyalty</text>
<text x="356" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Are rules transparent and</text>
<text x="356" y="406.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">correctly executed?</text>
<rect x="624" y="292" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<rect x="624" y="292" width="268" height="10" rx="6" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<circle cx="654" cy="338" r="14" fill="#1F3A5F" stroke="none"/>
<text x="654" y="343" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="678" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Property fulfillment</text>
<text x="644" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can the property see and fulfil</text>
<text x="644" y="406.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">the commitment?</text>
<rect x="912" y="292" width="268" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<rect x="912" y="292" width="268" height="10" rx="6" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<circle cx="942" cy="338" r="14" fill="#1F3A5F" stroke="none"/>
<text x="942" y="343" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="966" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Data &amp; reporting</text>
<text x="932" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can teams diagnose performance</text>
<text x="932" y="406.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">and exceptions?</text>
