<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Product proposition canvas</title><desc id="d">Seven questions to answer for each product: audience, need, value proposition, eligibility, price and terms, fulfillment, proof of value.</desc>
<rect width="1200" height="560" fill="#F4F7FB"/>
<text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F3A5F" text-anchor="start">Proposition canvas: define the product before you market it</text>
<text x="48" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="start">Answer all seven for every product</text>
<rect x="48" y="118" width="268" height="154" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<rect x="48" y="118" width="268" height="40" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<text x="64" y="144" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Audience</text>
<text x="64" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">Which guest or trip context is</text>
<text x="64" y="210.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">it relevant to?</text>
<rect x="332" y="118" width="268" height="154" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<rect x="332" y="118" width="268" height="40" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<text x="348" y="144" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Need</text>
<text x="348" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">What customer problem does it</text>
<text x="348" y="210.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">solve?</text>
<rect x="616" y="118" width="268" height="154" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<rect x="616" y="118" width="268" height="40" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<text x="632" y="144" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Value proposition</text>
<text x="632" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">Why would the customer choose</text>
<text x="632" y="210.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">it?</text>
<rect x="900" y="118" width="252" height="154" rx="12" fill="#FFFFFF" stroke="#2B5B84" stroke-width="2"/>
<rect x="900" y="118" width="252" height="40" rx="12" fill="#2B5B84" stroke="#2B5B84" stroke-width="0"/>
<text x="916" y="144" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Eligibility</text>
<text x="916" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">Who can buy or receive it?</text>
<rect x="48" y="288" width="360" height="154" rx="12" fill="#FFFFFF" stroke="#2B5B84" stroke-width="2"/>
<rect x="48" y="288" width="360" height="40" rx="12" fill="#2B5B84" stroke="#2B5B84" stroke-width="0"/>
<text x="64" y="314" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Price &amp; terms</text>
<text x="64" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">What does it cost and what restrictions</text>
<text x="64" y="380.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">apply?</text>
<rect x="424" y="288" width="360" height="154" rx="12" fill="#FFFFFF" stroke="#E9A23B" stroke-width="2"/>
<rect x="424" y="288" width="360" height="40" rx="12" fill="#E9A23B" stroke="#E9A23B" stroke-width="0"/>
<text x="440" y="314" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Fulfillment</text>
<text x="440" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">What must happen operationally after</text>
<text x="440" y="380.25" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">purchase?</text>
<rect x="800" y="288" width="352" height="154" rx="12" fill="#FFFFFF" stroke="#D9694F" stroke-width="2"/>
<rect x="800" y="288" width="352" height="40" rx="12" fill="#D9694F" stroke="#D9694F" stroke-width="0"/>
<text x="816" y="314" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start">Proof of value</text>
<text x="816" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1B2733" text-anchor="start">How will we know the offer is useful?</text>
<rect x="48" y="462" width="1104" height="62" rx="12" fill="#FFF6E5" stroke="#E9A23B" stroke-width="1.6"/>
<text x="68" y="488" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1B2733" text-anchor="start">Hypothetical example: flexible arrival.</text>
<text x="68" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Optional arrival-time service, subject to property capacity and explicit terms, shown in booking or pre-arrival; success = incremental purchase alongside fulfillment and satisfaction.</text>
<text x="48" y="540" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" font-style="italic">Hypothetical illustration. Not a description of an actual campaign.</text>
</svg>