<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Illustrative add-on commercial funnel with formulas</title><desc id="d">Six funnel stages from eligible bookings to net incremental contribution, with formulas and measurement guardrails. No data shown.</desc>
<rect width="1200" height="600" fill="#F4F7FB"/>
<text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F3A5F" text-anchor="start">A transparent commercial model for an add-on</text>
<text x="48" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="start">Illustrative funnel structure with agreed-in-advance definitions</text>
<polygon points="48.0,112 684.0,112 664.0,176 68.0,176" fill="#1F3A5F" stroke="none"/>
<text x="366" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Eligible bookings</text>
<text x="706" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Denominator agreed up front</text>
<line x1="690.0" y1="144" x2="698" y2="144" stroke="#D5DDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
<polygon points="78.0,188 654.0,188 634.0,252 98.0,252" fill="#2B5B84" stroke="none"/>
<text x="366" y="226" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Offer exposure</text>
<text x="706" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Exposure rate = shown ÷ eligible</text>
<line x1="660.0" y1="220" x2="698" y2="220" stroke="#D5DDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
<polygon points="108.0,264 624.0,264 604.0,328 128.0,328" fill="#2A9D8F" stroke="none"/>
<text x="366" y="302" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Offer engagement</text>
<text x="706" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Engagement = interactions ÷</text>
<text x="706" y="304.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">exposures</text>
<line x1="630.0" y1="296" x2="698" y2="296" stroke="#D5DDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
<polygon points="138.0,340 594.0,340 574.0,404 158.0,404" fill="#2A9D8F" stroke="none"/>
<text x="366" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Purchase conversion</text>
<text x="706" y="364.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Conversion = purchases ÷ exposures ·</text>
<text x="706" y="380.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Attach = with add-on ÷ eligible</text>
<line x1="600.0" y1="372" x2="698" y2="372" stroke="#D5DDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
<polygon points="168.0,416 564.0,416 544.0,480 188.0,480" fill="#E9A23B" stroke="none"/>
<text x="366" y="454" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fulfilled purchases</text>
<text x="706" y="440.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Fulfillment = fulfilled ÷ purchases</text>
<line x1="570.0" y1="448" x2="698" y2="448" stroke="#D5DDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
<polygon points="198.0,492 534.0,492 514.0,556 218.0,556" fill="#D9694F" stroke="none"/>
<text x="366" y="530" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Net incremental contribution</text>
<text x="706" y="516.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Incremental revenue − variable costs</text>
<text x="706" y="532.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">− discounts − refunds − service</text>
<text x="706" y="549.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">costs</text>
<line x1="540.0" y1="524" x2="698" y2="524" stroke="#D5DDE8" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="940" y="112" width="212" height="330" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<text x="956" y="140" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F" text-anchor="start">Guardrails</text>
<text x="956" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">• Protect core booking</text>
<text x="956" y="176.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">completion</text>
<text x="956" y="201.75" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">• Separate gross from</text>
<text x="956" y="218.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">incremental</text>
<text x="956" y="243.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">• Do not scale what can't</text>
<text x="956" y="260.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">be fulfilled</text>
<text x="956" y="285.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">• Watch complaints and</text>
<text x="956" y="302.125" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">contact rate</text>
<text x="956" y="327.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">• Avoid shifting friction</text>
<text x="956" y="343.875" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">to hotel teams</text>
<text x="48" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" font-style="italic">Illustrative structure only. No test results or business-case figures are claimed.</text>
</svg>