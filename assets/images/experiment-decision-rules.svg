<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d">
<title id="t">Experiment decision rules: scale, iterate or pause</title><desc id="d">Hypothesis, test design, and three decision outcomes: scale when conversion and contribution improve with healthy guardrails, iterate when engagement is strong but purchase weak, pause when guardrails are breached.</desc>
<rect width="1200" height="460" fill="#F4F7FB"/>
<text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F3A5F" text-anchor="start">Experiment template: decide the rules before launch</text>
<text x="48" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="start">Control vs variant, one primary metric, pre-agreed guardrails</text>
<rect x="48" y="112" width="340" height="296" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<text x="66" y="142" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F" text-anchor="start">Hypothesis</text>
<text x="66" y="164.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2733" text-anchor="start">A relevant, clearly explained add-on at the</text>
<text x="66" y="182.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2733" text-anchor="start">right moment lifts purchase without hurting</text>
<text x="66" y="200.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2733" text-anchor="start">core booking conversion or satisfaction.</text>
<text x="66" y="252" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F" text-anchor="start">Test design</text>
<circle cx="74" cy="273" r="4.5" fill="#2A9D8F" stroke="none"/>
<text x="88" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Define eligible customers and exclusions</text>
<circle cx="74" cy="307" r="4.5" fill="#2A9D8F" stroke="none"/>
<text x="88" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Control journey vs variant</text>
<circle cx="74" cy="341" r="4.5" fill="#2A9D8F" stroke="none"/>
<text x="88" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Hold price, terms and inventory rules fixed</text>
<circle cx="74" cy="375" r="4.5" fill="#2A9D8F" stroke="none"/>
<text x="88" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2733" text-anchor="start">Set primary metric and guardrails up front</text>
<line x1="388" y1="260" x2="440" y2="158" stroke="#5B6B7C" stroke-width="2"/>
<rect x="440" y="112" width="712" height="92" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.2"/>
<rect x="440" y="112" width="130" height="92" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<text x="505" y="166" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">SCALE</text>
<text x="588" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Conversion and incremental contribution improve; fulfillment and</text>
<text x="588" y="169.575" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">customer guardrails healthy</text>
<line x1="388" y1="260" x2="440" y2="260" stroke="#5B6B7C" stroke-width="2"/>
<rect x="440" y="214" width="712" height="92" rx="12" fill="#FFFFFF" stroke="#E9A23B" stroke-width="2.2"/>
<rect x="440" y="214" width="130" height="92" rx="12" fill="#E9A23B" stroke="#E9A23B" stroke-width="0"/>
<text x="505" y="268" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">ITERATE</text>
<text x="588" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Engagement strong, purchase weak: revisit proposition, price, content or</text>
<text x="588" y="271.575" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">checkout</text>
<line x1="388" y1="260" x2="440" y2="362" stroke="#5B6B7C" stroke-width="2"/>
<rect x="440" y="316" width="712" height="92" rx="12" fill="#FFFFFF" stroke="#D9694F" stroke-width="2.2"/>
<rect x="440" y="316" width="130" height="92" rx="12" fill="#D9694F" stroke="#D9694F" stroke-width="0"/>
<text x="505" y="370" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">PAUSE</text>
<text x="588" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Fulfillment, complaints, refunds or core-booking decline beyond agreed</text>
<text x="588" y="373.575" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">thresholds</text>
<text x="48" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" font-style="italic">Proposed experiment template. No result is claimed.</text>
</svg>