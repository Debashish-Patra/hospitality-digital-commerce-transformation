<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Five leadership principles</title><desc id="d">Start with the operating model; treat migration as product transformation; design the whole customer promise; connect product strategy with commercialization; measure outcomes, not activity.</desc>
<rect width="1200" height="520" fill="#F4F7FB"/>
<text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F3A5F" text-anchor="start">Five principles for transformation leaders</text>
<text x="48" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="start">Understand → Translate → Design → Commercialize → Measure</text>
<rect x="48.0" y="118" width="214" height="330" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<rect x="48.0" y="118" width="214" height="84" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<text x="66.0" y="160" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">1</text>
<text x="66.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Start with the</text>
<text x="66.0" y="252.625" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">operating model</text>
<text x="66.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Understand the work,</text>
<text x="66.0" y="334.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">decision rights,</text>
<text x="66.0" y="352.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">exceptions and service</text>
<text x="66.0" y="370.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">commitments first.</text>
<rect x="270.5" y="118" width="214" height="330" rx="12" fill="#FFFFFF" stroke="#2B5B84" stroke-width="2"/>
<rect x="270.5" y="118" width="214" height="84" rx="12" fill="#2B5B84" stroke="#2B5B84" stroke-width="0"/>
<text x="288.5" y="160" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">2</text>
<text x="288.5" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Treat migration as</text>
<text x="288.5" y="252.625" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">product</text>
<text x="288.5" y="273.25" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">transformation</text>
<text x="288.5" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Challenge constraints and</text>
<text x="288.5" y="334.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">define future</text>
<text x="288.5" y="352.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">capabilities; do not</text>
<text x="288.5" y="370.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">merely reproduce the</text>
<text x="288.5" y="388.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">past.</text>
<rect x="493.0" y="118" width="214" height="330" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<rect x="493.0" y="118" width="214" height="84" rx="12" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<text x="511.0" y="160" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">3</text>
<text x="511.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Design the whole</text>
<text x="511.0" y="252.625" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">customer promise</text>
<text x="511.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Discoverable,</text>
<text x="511.0" y="334.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">understandable,</text>
<text x="511.0" y="352.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">purchasable and</text>
<text x="511.0" y="370.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">fulfillable. A polished</text>
<text x="511.0" y="388.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">UI cannot fix weak</text>
<text x="511.0" y="407.125" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">readiness.</text>
<rect x="715.5" y="118" width="214" height="330" rx="12" fill="#FFFFFF" stroke="#E9A23B" stroke-width="2"/>
<rect x="715.5" y="118" width="214" height="84" rx="12" fill="#E9A23B" stroke="#E9A23B" stroke-width="0"/>
<text x="733.5" y="160" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">4</text>
<text x="733.5" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Connect product and</text>
<text x="733.5" y="252.625" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">commercialization</text>
<text x="733.5" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Definition, audience,</text>
<text x="733.5" y="334.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">positioning, price,</text>
<text x="733.5" y="352.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">placement, comms and</text>
<text x="733.5" y="370.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">fulfillment designed</text>
<text x="733.5" y="388.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">together.</text>
<rect x="938.0" y="118" width="214" height="330" rx="12" fill="#FFFFFF" stroke="#D9694F" stroke-width="2"/>
<rect x="938.0" y="118" width="214" height="84" rx="12" fill="#D9694F" stroke="#D9694F" stroke-width="0"/>
<text x="956.0" y="160" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">5</text>
<text x="956.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">Measure outcomes,</text>
<text x="956.0" y="252.625" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1B2733" text-anchor="start">not activity</text>
<text x="956.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Behavior, incremental</text>
<text x="956.0" y="334.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">contribution,</text>
<text x="956.0" y="352.45" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">fulfillment, operational</text>
<text x="956.0" y="370.675" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">load and trust, not just</text>
<text x="956.0" y="388.9" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">milestones or clicks.</text>
<text x="48" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" font-style="italic">A reusable leadership lens. Not a claim that every framework was used verbatim in any engagement.</text>
</svg>