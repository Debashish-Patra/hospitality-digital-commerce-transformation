<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Opportunity prioritization scorecard template</title><desc id="d">Five scoring dimensions rated 1 to 5 and summed into a priority score, with an empty example scorecard.</desc>
<rect width="1200" height="520" fill="#F4F7FB"/>
<text x="48" y="58" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F3A5F" text-anchor="start">Opportunity prioritization: five dimensions, one transparent score</text>
<text x="48" y="86" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="start">Template, not historical program criteria</text>
<rect x="48" y="118" width="520" height="52" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
<rect x="48" y="118" width="10" height="52" rx="4" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<text x="72" y="140" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1B2733" text-anchor="start">Customer value</text>
<text x="72" y="160" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Meaningful customer problem?</text>
<circle cx="430" cy="144" r="10" fill="#FFFFFF" stroke="#1F3A5F"/>
<circle cx="456" cy="144" r="10" fill="#FFFFFF" stroke="#1F3A5F"/>
<circle cx="482" cy="144" r="10" fill="#FFFFFF" stroke="#1F3A5F"/>
<circle cx="508" cy="144" r="10" fill="#FFFFFF" stroke="#1F3A5F"/>
<circle cx="534" cy="144" r="10" fill="#FFFFFF" stroke="#1F3A5F"/>
<text x="416" y="149" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F3A5F" text-anchor="end">1–5</text>
<rect x="48" y="180" width="520" height="52" rx="10" fill="#FFFFFF" stroke="#2B5B84" stroke-width="2"/>
<rect x="48" y="180" width="10" height="52" rx="4" fill="#2B5B84" stroke="#2B5B84" stroke-width="0"/>
<text x="72" y="202" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1B2733" text-anchor="start">Commercial potential</text>
<text x="72" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Credible path to incremental contribution?</text>
<circle cx="430" cy="206" r="10" fill="#FFFFFF" stroke="#2B5B84"/>
<circle cx="456" cy="206" r="10" fill="#FFFFFF" stroke="#2B5B84"/>
<circle cx="482" cy="206" r="10" fill="#FFFFFF" stroke="#2B5B84"/>
<circle cx="508" cy="206" r="10" fill="#FFFFFF" stroke="#2B5B84"/>
<circle cx="534" cy="206" r="10" fill="#FFFFFF" stroke="#2B5B84"/>
<text x="416" y="211" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B5B84" text-anchor="end">1–5</text>
<rect x="48" y="242" width="520" height="52" rx="10" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2"/>
<rect x="48" y="242" width="10" height="52" rx="4" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<text x="72" y="264" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1B2733" text-anchor="start">Feasibility</text>
<text x="72" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Platform, data and integration manageable?</text>
<circle cx="430" cy="268" r="10" fill="#FFFFFF" stroke="#2A9D8F"/>
<circle cx="456" cy="268" r="10" fill="#FFFFFF" stroke="#2A9D8F"/>
<circle cx="482" cy="268" r="10" fill="#FFFFFF" stroke="#2A9D8F"/>
<circle cx="508" cy="268" r="10" fill="#FFFFFF" stroke="#2A9D8F"/>
<circle cx="534" cy="268" r="10" fill="#FFFFFF" stroke="#2A9D8F"/>
<text x="416" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A9D8F" text-anchor="end">1–5</text>
<rect x="48" y="304" width="520" height="52" rx="10" fill="#FFFFFF" stroke="#E9A23B" stroke-width="2"/>
<rect x="48" y="304" width="10" height="52" rx="4" fill="#E9A23B" stroke="#E9A23B" stroke-width="0"/>
<text x="72" y="326" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1B2733" text-anchor="start">Operational readiness</text>
<text x="72" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can it be fulfilled consistently?</text>
<circle cx="430" cy="330" r="10" fill="#FFFFFF" stroke="#E9A23B"/>
<circle cx="456" cy="330" r="10" fill="#FFFFFF" stroke="#E9A23B"/>
<circle cx="482" cy="330" r="10" fill="#FFFFFF" stroke="#E9A23B"/>
<circle cx="508" cy="330" r="10" fill="#FFFFFF" stroke="#E9A23B"/>
<circle cx="534" cy="330" r="10" fill="#FFFFFF" stroke="#E9A23B"/>
<text x="416" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E9A23B" text-anchor="end">1–5</text>
<rect x="48" y="366" width="520" height="52" rx="10" fill="#FFFFFF" stroke="#D9694F" stroke-width="2"/>
<rect x="48" y="366" width="10" height="52" rx="4" fill="#D9694F" stroke="#D9694F" stroke-width="0"/>
<text x="72" y="388" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1B2733" text-anchor="start">Strategic fit</text>
<text x="72" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Supports target experience and platform direction?</text>
<circle cx="430" cy="392" r="10" fill="#FFFFFF" stroke="#D9694F"/>
<circle cx="456" cy="392" r="10" fill="#FFFFFF" stroke="#D9694F"/>
<circle cx="482" cy="392" r="10" fill="#FFFFFF" stroke="#D9694F"/>
<circle cx="508" cy="392" r="10" fill="#FFFFFF" stroke="#D9694F"/>
<circle cx="534" cy="392" r="10" fill="#FFFFFF" stroke="#D9694F"/>
<text x="416" y="397" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#D9694F" text-anchor="end">1–5</text>
<text x="620" y="150" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start">Priority score</text>
<rect x="620" y="164" width="530" height="62" rx="12" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<text x="885" y="203" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Customer + Commercial + Feasibility + Readiness + Fit</text>
<text x="620" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F3A5F" text-anchor="start">Use it well</text>
<circle cx="634" cy="294" r="7" fill="#2A9D8F" stroke="none"/>
<text x="654" y="299.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Use one consistent 1–5 scale</text>
<circle cx="634" cy="340" r="7" fill="#2A9D8F" stroke="none"/>
<text x="654" y="345.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Write down the evidence behind each score</text>
<circle cx="634" cy="386" r="7" fill="#2A9D8F" stroke="none"/>
<text x="654" y="391.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Add risk or effort explicitly, not hidden in a subjective score</text>
<circle cx="634" cy="432" r="7" fill="#2A9D8F" stroke="none"/>
<text x="654" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1B2733" text-anchor="start">Revisit scores when pilots produce data</text>
<text x="48" y="500" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" font-style="italic">Suggested template. Weights and scales should be agreed before scoring.</text>
</svg>