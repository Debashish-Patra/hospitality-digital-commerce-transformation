<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-labelledby="t d">
<title id="t">Transformation thesis overview</title><desc id="d">Five connected steps: understand the business, translate into capabilities, design the experience, commercialize the proposition, measure the outcome. Three lenses: operations, technology, commerce.</desc>
<rect width="1200" height="496" fill="#F4F7FB"/>
<text x="48" y="62" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F3A5F" text-anchor="start">Digital Commerce Transformation</text>
<text x="48" y="92" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6B7C" text-anchor="start">From operating model to platform, customer experience and growth</text>
<polygon points="48,130 240,130 262,211.0 240,292 48,292" fill="#1F3A5F" stroke="none"/>
<circle cx="82" cy="164" r="16" fill="#FFFFFF" stroke="none"/>
<text x="82" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="middle">1</text>
<text x="66" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Understand the</text>
<text x="66" y="226.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">business</text>
<text x="66" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Processes, roles, rules,</text>
<text x="66" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">exceptions</text>
<polygon points="270,130 462,130 484,211.0 462,292 270,292" fill="#2B5B84" stroke="none"/>
<circle cx="304" cy="164" r="16" fill="#FFFFFF" stroke="none"/>
<text x="304" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B5B84" text-anchor="middle">2</text>
<text x="288" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Translate into</text>
<text x="288" y="226.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">capabilities</text>
<text x="288" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Requirements,</text>
<text x="288" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">dependencies, migration</text>
<text x="288" y="278.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">scope</text>
<polygon points="492,130 684,130 706,211.0 684,292 492,292" fill="#2A9D8F" stroke="none"/>
<circle cx="526" cy="164" r="16" fill="#FFFFFF" stroke="none"/>
<text x="526" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="middle">3</text>
<text x="510" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Design the</text>
<text x="510" y="226.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">experience</text>
<text x="510" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Journeys, product</text>
<text x="510" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">discovery, transparency</text>
<polygon points="714,130 906,130 928,211.0 906,292 714,292" fill="#E9A23B" stroke="none"/>
<circle cx="748" cy="164" r="16" fill="#FFFFFF" stroke="none"/>
<text x="748" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9A23B" text-anchor="middle">4</text>
<text x="732" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Commercialize the</text>
<text x="732" y="226.75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">proposition</text>
<text x="732" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Assortment,</text>
<text x="732" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">merchandising, launch</text>
<polygon points="936,130 1128,130 1150,211.0 1128,292 936,292" fill="#D9694F" stroke="none"/>
<circle cx="970" cy="164" r="16" fill="#FFFFFF" stroke="none"/>
<text x="970" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D9694F" text-anchor="middle">5</text>
<text x="954" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Measure the outcome</text>
<text x="954" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">Incremental value,</text>
<text x="954" y="263.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="start">guardrails, learning</text>
<text x="600" y="346" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="middle">Three lenses held together at every step</text>
<rect x="48" y="366" width="368" height="86" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2.5"/>
<rect x="48" y="366" width="10" height="86" rx="4" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="0"/>
<text x="76" y="396" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F3A5F" text-anchor="start">Operations</text>
<text x="76" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can the business reliably deliver the</text>
<text x="76" y="436.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">promised experience?</text>
<rect x="432" y="366" width="368" height="86" rx="12" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
<rect x="432" y="366" width="10" height="86" rx="4" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="0"/>
<text x="460" y="396" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2A9D8F" text-anchor="start">Technology</text>
<text x="460" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can the platform support the products, rules,</text>
<text x="460" y="436.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">data and transactions?</text>
<rect x="816" y="366" width="368" height="86" rx="12" fill="#FFFFFF" stroke="#E9A23B" stroke-width="2.5"/>
<rect x="816" y="366" width="10" height="86" rx="4" fill="#E9A23B" stroke="#E9A23B" stroke-width="0"/>
<text x="844" y="396" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9A23B" text-anchor="start">Commerce</text>
<text x="844" y="418.0" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">Can customers discover, understand, buy and</text>
<text x="844" y="436.225" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5B6B7C" text-anchor="start">receive the product with confidence?</text>
<text x="48" y="476" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" font-style="italic">Original illustrative framework. No client data, systems or results are depicted.</text>
</svg>